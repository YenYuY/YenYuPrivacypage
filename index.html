<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>隱私權政策</title>
  <style>
    :root {
      --bg: #f6f2ea;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #4b5563;
      --accent: #1f6f5c;
      --accent-2: #f2d398;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Serif TC", "Source Han Serif TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #ffffff 0%, #f3efe6 45%, var(--bg) 100%),
        linear-gradient(135deg, #efe7d9 0%, #f6f2ea 60%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .page {
      width: min(860px, 100%);
      background: var(--card);
      border: 1px solid #e7e2d7;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
      position: relative;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      right: -60px;
      top: -80px;
      background: radial-gradient(circle at 30% 30%, var(--accent-2), transparent 70%);
      opacity: 0.7;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 24px;
    }

    .section {
      border-top: 1px solid #eee8dd;
      padding-top: 20px;
      margin-top: 20px;
    }

    .section h2 {
      font-size: 20px;
      margin: 0 0 10px;
      color: var(--accent);
    }

    .section p {
      margin: 0;
      line-height: 1.7;
      color: var(--ink);
    }

    .note {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .contact {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: inline-block;
      margin-top: 6px;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px dashed var(--accent);
      padding-bottom: 2px;
    }

    @media (max-width: 520px) {
      .page { padding: 28px 20px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>隱私權政策</h1>
    <div class="subtitle">本 App 尊重並保護使用者的隱私權。</div>

    <section class="section">
      <h2>資料收集</h2>
      <p>本 App 不會收集、儲存或分享任何可識別個人身份的資訊。</p>
      <p class="note">或：本 App 僅在必要時收集使用者提供的資訊，用於功能運作。</p>
    </section>

    <section class="section">
      <h2>第三方服務</h2>
      <p>本 App 不使用第三方分析或廣告服務。</p>
    </section>

    <section class="section">
      <h2>資料使用</h2>
      <p>所有資料僅用於 App 功能，不會出售或提供給第三方。</p>
    </section>

    <section class="section">
      <h2>聯絡方式</h2>
      <p>如有任何隱私相關問題，請聯絡：<a class="contact" href="mailto:ic611277@gmail.com">ic611277@gmail.com</a></p>
    </section>
  </main>
</body>
</html>
